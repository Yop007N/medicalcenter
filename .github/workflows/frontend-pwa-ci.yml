name: Frontend PWA CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend-pwa/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend-pwa/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: frontend-pwa/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: frontend-pwa
      run: pnpm install

    - name: Run tests (Skipped)
      working-directory: frontend-pwa
      run: echo "Skipping tests as angular.json is missing"
      # run: pnpm test -- --watch=false --code-coverage

    - name: Build (Skipped)
      working-directory: frontend-pwa
      run: echo "Skipping build as angular.json is missing"
      # run: pnpm run ionic:build

