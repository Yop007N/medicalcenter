name: Frontend PWA CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend-pwa/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend-pwa/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: frontend-pwa/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: frontend-pwa
      run: pnpm install

    - name: Run tests
      working-directory: frontend-pwa
      run: pnpm test -- --watch=false --code-coverage

    - name: Build
      working-directory: frontend-pwa
      run: pnpm run ionic:build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-pwa-build
        path: frontend-pwa/www/
