name: Frontend Profesional CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend-profesional/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend-profesional/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: frontend-profesional/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: frontend-profesional
      run: pnpm install --frozen-lockfile

    - name: Run linting
      working-directory: frontend-profesional
      run: pnpm run lint

    - name: Run tests
      working-directory: frontend-profesional
      run: pnpm test -- --watch=false --code-coverage

    - name: Build
      working-directory: frontend-profesional
      run: pnpm run build -- --configuration production

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-profesional-build
        path: frontend-profesional/dist/
