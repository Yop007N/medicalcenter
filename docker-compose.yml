services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medical-services-db
    environment:
      POSTGRES_DB: medical_services_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medical-services-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-medical_services_dev} || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Redis
  redis:
    image: redis:7-alpine
    container_name: medical-services-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf --protected-mode no
    networks:
      - medical-services-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    container_name: medical-services-backend
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/medical_services_dev
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medical-services-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).getcode()==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    container_name: medical-services-celery
    command: celery -A celery_worker.celery worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/medical_services_dev
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - medical-services-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A celery_worker.celery inspect ping -d celery@$$HOSTNAME >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 45s

  # Frontend Web
  frontend-web:
    build:
      context: .
      dockerfile: docker/frontend-profesional/Dockerfile
    container_name: medical-services-frontend-web
    ports:
      - "${FRONTEND_WEB_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medical-services-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Frontend Admin Profesional
  frontend-admin:
    build:
      context: .
      dockerfile: docker/frontend-admin-profesional/Dockerfile
    container_name: medical-services-frontend-admin
    ports:
      - "${FRONTEND_ADMIN_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medical-services-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Frontend PWA
  frontend-pwa:
    build:
      context: .
      dockerfile: docker/frontend-paciente/Dockerfile
    container_name: medical-services-frontend-pwa
    ports:
      - "${FRONTEND_PWA_PORT:-8100}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medical-services-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
  redis_data:

networks:
  medical-services-network:
    driver: bridge
